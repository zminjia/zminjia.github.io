<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贴图</title>
  <meta name="description" content="贴纸与表情包">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="hero" id="hero" hidden>
      <img id="hero-img" alt="">
    </div>
    <p class="caption" id="caption">加载中…</p>

    <section class="section" id="tags-section" hidden>
      <h2 class="label">标签</h2>
      <ul class="items" id="tags"></ul>
    </section>
  </main>

  <section class="strip-section" id="strip-section" hidden aria-label="作品">
    <div class="strip" id="strip">
      <div class="strip-track" id="strip-track"></div>
    </div>
  </section>

  <button class="theme-toggle pill" id="theme-toggle" type="button" aria-label="切换深色模式">深色</button>

  <script src="js/app.js"></script>
</body>
</html>
