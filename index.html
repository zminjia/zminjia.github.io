<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贴图</title>
  <meta name="description" content="贴纸与表情包">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>贴图</h1>
      <p class="lede">贴纸与表情包</p>
    </header>

    <nav class="tags" id="tags" aria-label="按标签浏览" hidden></nav>

    <main>
      <p class="status" id="status">加载中…</p>
      <div class="grid" id="grid" hidden></div>
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-backdrop" data-close></div>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <button class="lightbox-close" type="button" data-close aria-label="关闭">×</button>
      <div class="lightbox-image">
        <img id="lightbox-img" alt="">
      </div>
      <div class="lightbox-meta">
        <h2 id="lightbox-title"></h2>
        <div class="lightbox-tags" id="lightbox-tags"></div>
        <time id="lightbox-date"></time>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
