<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贴图</title>
  <meta name="description" content="贴纸与表情包">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="stage">
      <div class="hero" id="hero" hidden>
        <div class="hero-frame" id="hero-frame">
          <img id="hero-img" alt="" draggable="false">
          <span class="hero-mark" aria-hidden="true">DaJia</span>
        </div>
      </div>

      <header class="intro">
        <h1 class="title" id="title">加载中…</h1>
        <p class="meta" id="meta"></p>
      </header>

      <nav class="tags" id="tags" aria-label="按标签浏览" hidden></nav>

      <section class="strip" id="strip-section" hidden aria-label="作品">
        <div class="strip-scroller" id="strip">
          <div class="strip-track" id="strip-track"></div>
        </div>
      </section>
    </div>
  </main>

  <button class="theme-toggle pill" id="theme-toggle" type="button" aria-label="切换深色模式">深色</button>

  <script src="js/app.js"></script>
</body>
</html>
